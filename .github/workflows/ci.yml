# Checks every pull request and every push to main: quick checks, unit tests, and an
# unsigned build in Debug and Release. It publishes nothing: releases are built and signed
# on the maintainer's Mac (the signing certificate and the Sparkle key stay there, D-026).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 27 with Xcode 27.1, the versions the app is developed with (image in preview).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Quick checks
        run: scripts/ci-checks.sh

      - name: Unit tests
        run: swift test

      - name: Build (Debug, unsigned)
        run: >
          xcodebuild -project AirBattery.xcodeproj -scheme AirBattery -configuration Debug
          -derivedDataPath build/DerivedData -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO build

      - name: Build (Release, unsigned)
        run: >
          xcodebuild -project AirBattery.xcodeproj -scheme AirBattery -configuration Release
          -derivedDataPath build/DerivedData -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO build

      - name: Check the built app
        run: |
          app="build/DerivedData/Build/Products/Release/AirBattery Plus.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :SUFeedURL' -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist"
          test -d "$app/Contents/PlugIns/AirBatteryWidgetExtension.appex"
          test -x "$app/Contents/Resources/libimobiledevice/bin/ideviceinfo"
          "$app/Contents/Resources/abtp" --help > /dev/null
